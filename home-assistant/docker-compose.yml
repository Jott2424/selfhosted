version: "3.9"

services:
  homeassistant:
    container_name: d_homeassistant
    image: lscr.io/linuxserver/homeassistant:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=etc/UTC
    volumes:
      - /mnt/Vault/Homelab/Portainer/Stacks/HomeAssistant/dev/config:/config
    restart: unless-stopped
    network_mode: host
    privileged: true