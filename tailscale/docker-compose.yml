version: "3.8"

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: truenas
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /mnt/Vault/Homelab/Portainer/Stacks/Tailscale/prod/data:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_AUTHKEY=NONE