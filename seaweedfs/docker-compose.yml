services:
  p_seaweedfs:
    image: chrislusf/seaweedfs:latest  # pin to a specific release once you've settled on one
    container_name: p_seaweedfs
    restart: unless-stopped
    # all-in-one: master + volume server + filer + S3 gateway in a single process
    command: >
      server
      -dir=/data
      -volume.max=0
      -master.volumeSizeLimitMB=1024
      -filer
      -s3
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "58333:8333"  # S3 API (host:docker)
      - "58888:8888"  # filer UI / HTTP file API
      - "59333:9333"  # master UI (cluster status, volumes)
    volumes:
      - /mnt/Vault/Homelab/Portainer/Stacks/seaweedfs/prod/data:/data  # use local disk, not NFS (see README)
      - /mnt/Vault/Homelab/Portainer/Stacks/seaweedfs/prod/s3.json:/etc/seaweedfs/s3.json:ro  # S3 credentials, not committed (see s3.json.example)
