services:
  p_grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: always
    ports:
      - "50380:5000"  # host:docker
    environment:
      GRAMPSWEB_TREE: "Gramps Web"  # will create a new tree if not exists
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://p_grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://p_grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://p_grampsweb_redis:6379/1
    depends_on:
      - p_grampsweb_redis
    volumes:
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/users:/app/users          # persist user database
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/indexdir:/app/indexdir       # persist search index
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/thumbnail_cache:/app/thumbnail_cache  # persist thumbnails
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/cache:/app/cache          # persist export and report caches
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/secret:/app/secret        # persist flask secret
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/.gramps:/root/.gramps/grampsdb # persist Gramps database
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/media:/app/media          # persist media files
      - /mnt/Vault/Homelab/Portainer/Stacks/Gramps/prod/tmp:/tmp

  p_grampsweb_celery:
    <<: *grampsweb  # YAML merge key copying the entire grampsweb service config
    ports: []
    container_name: p_grampsweb_celery
    depends_on:
      - p_grampsweb
      - p_grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  p_grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: p_grampsweb_redis
    restart: always
    ports:
      - "50381:6379"  # host:docker